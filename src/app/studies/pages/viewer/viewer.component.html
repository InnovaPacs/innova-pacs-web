<div class="row">
  <div class="col-lg-12 d-flex align-items-stretch">
    <div class="card w-100">
      <div class="card-body p-4">
        <div class="d-flex mb-4 justify-content-between align-items-center">
          <h3>Visualizador DICOM</h3>
          <button class="btn btn-primary" (click)="goBack()">
            Regresar a estudios
          </button>
        </div>

        <hr class="my-3" />

        @if (loading) {
          <div class="viewer-state">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-3">Cargando visualizador DICOM...</p>
          </div>
        }

        @if (error) {
          <div class="viewer-state">
            <span class="fas fa-exclamation-triangle text-danger fs-1"></span>
            <p class="mt-3 text-danger">{{ error }}</p>
            <button class="btn btn-primary mt-2" (click)="goBack()">
              Regresar a estudios
            </button>
          </div>
        }

        @if (!loading && !error && viewerUrl && study) {
          <div class="viewer-layout">
            <div class="viewer-iframe-col">
              <iframe
                [src]="viewerUrl"
                class="viewer-frame"
                allowfullscreen
                allow="fullscreen"
              ></iframe>
            </div>
            <app-diagnostic-panel [study]="study" />
          </div>
        }
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
