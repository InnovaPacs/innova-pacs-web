<div class="min-vh-100 d-flex align-items-center justify-content-center bg-body-tertiary">
  <div class="card shadow-sm" style="max-width: 460px; width: 100%">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <span class="fas fa-user-shield fs-1 text-primary"></span>
        <h3 class="mt-3 mb-1">Portal del Paciente</h3>
        <p class="text-muted fs-sm">
          Ingresa tu CURP para acceder a tus estudios médicos
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="curp" class="form-label fw-semibold">CURP</label>
          <input
            id="curp"
            type="text"
            class="form-control"
            [class.is-invalid]="form.get('curp')?.invalid && form.get('curp')?.touched"
            placeholder="Ej. BAAA900101HDFXXX01"
            formControlName="curp"
            maxlength="18"
            (input)="form.get('curp')?.setValue(form.get('curp')?.value?.toUpperCase(), { emitEvent: false })"
          />
          @if (form.get('curp')?.invalid && form.get('curp')?.touched) {
            <div class="invalid-feedback">
              Ingresa una CURP válida (18 caracteres).
            </div>
          }
        </div>

        @if (error) {
          <div class="alert alert-danger py-2 fs-sm">
            <span class="fas fa-exclamation-circle me-2"></span>{{ error }}
          </div>
        }

        <button
          type="submit"
          class="btn btn-primary w-100 mt-2"
          [disabled]="form.invalid || loading"
        >
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            Verificando...
          } @else {
            Consultar mis estudios
          }
        </button>
      </form>
    </div>
  </div>
</div>
