<div class="min-vh-100 d-flex flex-column bg-body-tertiary p-3">
  <div class="card w-100 flex-grow-1">
    <div class="card-body p-4 d-flex flex-column">
      <div class="d-flex mb-4 justify-content-between align-items-center">
        <h3 class="mb-0">Visualizador DICOM</h3>
        <button class="btn btn-outline-secondary" (click)="goBack()">
          <span class="fas fa-arrow-left me-1"></span> Regresar a mis estudios
        </button>
      </div>

      <hr class="my-3" />

      @if (loading) {
        <div class="flex-grow-1 d-flex flex-column align-items-center justify-content-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-3 text-muted">Cargando visualizador DICOM...</p>
        </div>
      }

      @if (error) {
        <div class="flex-grow-1 d-flex flex-column align-items-center justify-content-center">
          <span class="fas fa-exclamation-triangle text-danger fs-1"></span>
          <p class="mt-3 text-danger">{{ error }}</p>
          <button class="btn btn-primary mt-2" (click)="goBack()">
            Regresar a mis estudios
          </button>
        </div>
      }

      @if (!loading && !error && viewerUrl) {
        <iframe
          [src]="viewerUrl"
          class="viewer-frame flex-grow-1"
          style="min-height: 75vh; border: none; border-radius: 4px;"
          allowfullscreen
          allow="fullscreen"
        ></iframe>
      }
    </div>
  </div>
</div>
