<div class="row">
  <div class="col-lg-12 d-flex align-items-stretch">
    <div class="card w-100">
      <div class="card-body p-4">

        <div class="d-flex mb-4 justify-content-between align-items-center">
          <h3>{{ title }}</h3>
        </div>

        <hr class="my-4" />

        <div class="row">
          <div class="col-lg-12 d-flex align-items-stretch">
            <div class="card w-100">
              <div class="card-body p-4">
                <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="row">

                  <div class="mb-3 col-xm-12 col-md-12">
                    <label for="imageFile" class="form-label">Seleccione foto</label>
                    <input
                      type="file"
                      class="form-control"
                      accept="image/png, image/jpeg"
                      id="imageFile"
                      (change)="onFileSelected($event)"
                    />
                  </div>

                  <div class="mb-3 col-xm-12 col-md-6">
                    <label for="username" class="form-label">Nombre de usuario</label>
                    <input
                      type="text"
                      class="form-control"
                      id="username"
                      placeholder="Ingresa nombre de usuario"
                      formControlName="username"
                    />
                  </div>

                  <div class="mb-3 col-xm-12 col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="Ingresa email"
                      formControlName="email"
                    />
                  </div>

                  <div class="mb-3 col-xm-12 col-md-6">
                    <label for="password" class="form-label">Nuevo password</label>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Ingresa nuevo password"
                      formControlName="password"
                    />
                  </div>

                  <div class="mb-3 col-xm-12 col-md-6">
                    <label for="role" class="form-label">Rol</label>
                    <select class="form-select" id="role" formControlName="role">
                      <option value="ADMINISTRADOR">Administrador</option>
                      <option value="RECEPCION">Recepción</option>
                      <option value="MEDICO">Médico</option>
                      <option value="RADIOLOGO">Radiólogo</option>
                    </select>
                  </div>

                  @if (showDoctorSelector) {
                    <div class="mb-3 col-xm-12 col-md-12">
                      <label for="doctorId" class="form-label">
                        Vincular con doctor existente
                        <span class="text-muted fw-normal small ms-1">(requerido para este rol)</span>
                      </label>
                      <select class="form-select" id="doctorId" formControlName="doctorId">
                        <option [ngValue]="null" disabled>Seleccionar doctor</option>
                        @for (doctor of doctors; track doctor.id) {
                          <option [value]="doctor.id">
                            {{ doctor.name }} — {{ doctor.specialty }}
                          </option>
                        }
                      </select>
                    </div>
                  }

                  @if (id) {
                    <div class="mb-3 col-xm-12 col-md-6">
                      <label for="status" class="form-label">Estatus</label>
                      <select class="form-select" id="status" formControlName="status">
                        <option value="ACTIVE">Activo</option>
                        <option value="INACTIVE">Inactivo</option>
                      </select>
                    </div>
                  }

                  <div class="col-12 mt-2">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                  </div>

                </form>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
